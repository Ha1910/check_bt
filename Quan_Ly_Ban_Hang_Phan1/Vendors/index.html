<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhoneStore</title>

    <!-- FontAwesome & Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/reset.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div
        class="container-fluid d-flex align-items-center justify-content-between"
      >
        <a class="navbar-brand" href="./index.html">PhoneStore</a>

        <select
          id="productFilter"
          onchange="filterProductsByType()"
          class="form-control mx-2"
        >
          <option value="all">Lọc sản phẩm</option>
          <option value="samsung">Samsung</option>
          <option value="iphone">Iphone</option>
        </select>

        <a href="./Cart.html" class="btn btn-light ml-2">
          <i class="fa fa-shopping-cart"></i> Giỏ hàng
        </a>
      </div>
    </nav>

    <!-- Main -->
    <div class="container mt-5">
      <h1 class="text-center mb-4">DANH SÁCH CÁC SẢN PHẨM</h1>
      <div id="productContainer" class="row justify-content-center"></div>
    </div>

    <!-- Scripts -->
    <script>
      let allProducts = [];

      function renderProducts(products) {
        const container = document.getElementById("productContainer");
        container.innerHTML = "";

        if (!products || products.length === 0) {
          container.innerHTML =
            '<p class="text-center">Không có sản phẩm nào.</p>';
          return;
        }

        products.forEach((product) => {
          const productHTML = `
        <div class="col-lg-3 col-md-4 col-sm-6 mb-4 d-flex align-items-stretch">
          <div class="card h-100">
            <img src="${product.img}" alt="${product.name}" class="card-img-top">
            <div class="card-body d-flex flex-column">
              <div>
                <div class="product-name">${product.name}</div>
                <div class="product-price">Giá: ${product.price}đ</div>
                <div class="product-info">Màn hình: ${product.screen}</div>
                <div class="product-info">Camera sau: ${product.backCamera}</div>
                <div class="product-info">Camera trước: ${product.frontCamera}</div>
                <div class="product-info">Mô tả: ${product.desc}</div>
              </div>
              <button class="btn btn-primary btn-add-cart mt-3" onclick="addToCart(${product.id})">
                Thêm vào giỏ hàng
              </button>
            </div>
          </div>
        </div>
      `;
          container.innerHTML += productHTML;
        });
      }

      function addToCart(productId) {
        const product = allProducts.find((item) => item.id == productId);

        if (!product) {
          alert("Không tìm thấy sản phẩm!");
          return;
        }

        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        const existingItem = cart.find((item) => item.productId == product.id);

        if (existingItem) {
          existingItem.quantity++;
        } else {
          const cartItem = {
            productId: product.id,
            name: product.name,
            price: product.price,
            image: product.img,
            quantity: 1,
          };
          cart.push(cartItem);
        }

        localStorage.setItem("cart", JSON.stringify(cart));
        window.location.href = "Cart.html";
      }

      function filterProductsByType() {
        const filterValue = document.getElementById("productFilter").value;
        const filteredProducts =
          filterValue === "all"
            ? allProducts
            : allProducts.filter(
                (product) =>
                  product.type && product.type.toLowerCase() === filterValue
              );

        renderProducts(filteredProducts);
      }

      function searchProducts() {
        const keyword = document
          .getElementById("searchInput")
          .value.toLowerCase()
          .trim();

        const filteredProducts = allProducts.filter((product) => {
          const nameMatch = product.name.toLowerCase().includes(keyword);
          const idMatch = product.id.toString().includes(keyword);
          const priceMatch = product.price.toString().includes(keyword);

          return nameMatch || idMatch || priceMatch;
        });

        renderProducts(filteredProducts);
      }

      fetch("https://680b244bd5075a76d989f845.mockapi.io/Products")
        .then((res) => res.json())
        .then((data) => {
          allProducts = data;
          renderProducts(allProducts);
        })
        .catch((err) => {
          console.error("Lỗi khi tải sản phẩm:", err);
          document.getElementById("productContainer").innerHTML =
            '<p class="text-center">Lỗi khi tải sản phẩm.</p>';
        });
    </script>
  </body>
</html>
