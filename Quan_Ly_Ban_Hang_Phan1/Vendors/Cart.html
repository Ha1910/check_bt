<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giỏ hàng</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .container {
        max-width: 900px;
      }
      .button-container {
        display: flex;
        justify-content: center;
      }
      .table th,
      .table td {
        text-align: center;
        vertical-align: middle;
      }
      .table {
        table-layout: fixed;
      }
    </style>
  </head>

  <body>
    <div class="container mt-5">
      <h1 class="text-center mb-4">GIỎ HÀNG CỦA BẠN</h1>
      <table class="table table-bordered">
        <thead style="background-color: green; color: white">
          <tr>
            <th>Tên sản phẩm</th>
            <th>Giá</th>
            <th>Số lượng</th>
            <th>Tổng tiền</th>
            <th>Hành động</th>
          </tr>
        </thead>
        <tbody id="cartTableBody"></tbody>
      </table>

      <div class="d-flex justify-content-between mt-4">
        <h4>Tổng tiền:</h4>
        <h4 id="totalAmount">0đ</h4>
      </div>

      <div class="button-container mt-4">
        <a href="index.html" class="btn btn-primary">Tiếp tục mua sắm</a>
      </div>

      <div class="button-container mt-4">
        <button class="btn btn-success" onclick="checkout()">Thanh toán</button>
      </div>
    </div>

    <script>
      function renderCart() {
        const cart = JSON.parse(localStorage.getItem("cart")) || [];
        const tableBody = document.getElementById("cartTableBody");
        const totalAmount = document.getElementById("totalAmount");

        tableBody.innerHTML = "";
        let total = 0;

        cart.forEach((item, index) => {
          const itemTotal = item.price * item.quantity;
          total += itemTotal;

          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${item.name}</td>
            <td>${item.price}đ</td>
            <td>
              <input type="number" value="${item.quantity}" min="1" style="width: 70px" onchange="updateQuantity(${index}, this.value)">
            </td>
            <td>${itemTotal}đ</td>
            <td>
              <div class="button-container">
                <button class="btn btn-warning btn-sm" onclick="updateQuantity(${index}, document.querySelectorAll('input')[${index}].value)">Sửa</button>
                <button class="btn btn-danger btn-sm" onclick="deleteItem(${index})">Xóa</button>
              </div>
            </td>
          `;
          tableBody.appendChild(row);
        });

        totalAmount.innerText = `${total}đ`;
      }

      function updateQuantity(index, newQuantity) {
        const cart = JSON.parse(localStorage.getItem("cart")) || [];
        newQuantity = parseInt(newQuantity);
        if (newQuantity <= 0 || isNaN(newQuantity)) {
          alert("Số lượng phải lớn hơn 0");
          return;
        }
        cart[index].quantity = newQuantity;
        localStorage.setItem("cart", JSON.stringify(cart));
        renderCart();
      }

      function deleteItem(index) {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        cart.splice(index, 1);
        localStorage.setItem("cart", JSON.stringify(cart));
        renderCart();
      }

      function checkout() {
        localStorage.setItem("cart", JSON.stringify([]));
        alert("Giỏ hàng đã được thanh toán!");
        renderCart();
      }

      renderCart();
    </script>
  </body>
</html>
